name: iumrahBusiness
options:
  bundleIdPrefix: com.iumrah
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "11"

targets:
  iumrahBusiness:
    type: application
    platform: iOS

    # One target, three destinations: iPhone, iPad, and Mac Catalyst.
    # XcodeGen target resources must be declared as target sources.
    # Asset catalogs are then routed to the Resources build phase.
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iumrah.business
        PRODUCT_NAME: iumrah Business

        # Universal Apple client: iPhone + iPad from one iOS archive,
        # plus a separate Mac Catalyst archive generated by the same target/workflow.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "iumrah Business"
        INFOPLIST_KEY_CFBundleIconName: "AppIcon"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

        # iOS/iPadOS and Mac Catalyst need different entitlement sets.
        CODE_SIGN_ENTITLEMENTS: Resources/iumrahBusiness.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Resources/iumrahBusinessMac.entitlements

        # Mac App Store / TestFlight distribution requirements for the Catalyst slice.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # Keep the Catalyst app installable on the user's Intel Mac running macOS 15.
        "MACOSX_DEPLOYMENT_TARGET[sdk=macosx*]": "14.0"

    scheme:
      testTargets: []
