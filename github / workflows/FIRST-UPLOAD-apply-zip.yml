name: Apply iumrah Business ZIP update

on:
  push:
    branches: [main]
    paths:
      - 'iumrah-business-*.zip'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract update safely
        shell: python
        run: |
          import pathlib, zipfile, sys
          root = pathlib.Path('.').resolve()
          archives = sorted(root.glob('iumrah-business-*.zip'))
          if not archives:
              print('No update ZIP found.')
              sys.exit(0)
          for archive in archives:
              print(f'Applying {archive.name}')
              with zipfile.ZipFile(archive) as z:
                  for member in z.infolist():
                      target = (root / member.filename).resolve()
                      if root not in target.parents and target != root:
                          raise RuntimeError(f'Unsafe ZIP path: {member.filename}')
                      if member.filename.startswith('.git/'):
                          raise RuntimeError('ZIP cannot modify .git')
                  z.extractall(root)
              archive.unlink()

      - name: Commit applied files
        run: |
          git config user.name "iumrah-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply iumrah Business update [skip ci]"
          git push
