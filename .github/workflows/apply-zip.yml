name: Apply iumrah Business ZIP update

on:
  push:
    branches: [main]
    paths:
      - 'iumrah-business-*.zip'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract update safely and remove ZIP
        shell: python
        run: |
          import pathlib
          import shutil
          import sys
          import zipfile

          root = pathlib.Path('.').resolve()
          archives = sorted(root.glob('iumrah-business-*.zip'))

          if not archives:
              print('No update ZIP found.')
              sys.exit(0)

          protected_prefixes = (
              '.git/',
              '.github/workflows/',
          )

          def is_junk(name: str) -> bool:
              clean = name.replace('\\', '/')
              parts = [part for part in clean.split('/') if part]
              return (
                  '__MACOSX' in parts
                  or clean.endswith('/.DS_Store')
                  or clean == '.DS_Store'
              )

          for archive in archives:
              print(f'Applying {archive.name}')

              with zipfile.ZipFile(archive) as z:
                  for member in z.infolist():
                      name = member.filename.replace('\\', '/')

                      if is_junk(name):
                          print(f'Skipping ZIP junk: {name}')
                          continue

                      target = (root / name).resolve()

                      if root not in target.parents and target != root:
                          raise RuntimeError(f'Unsafe ZIP path: {member.filename}')

                      if any(name.startswith(prefix) for prefix in protected_prefixes):
                          print(f'Skipping protected path: {name}')
                          continue

                      if member.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue

                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(member) as source, open(target, 'wb') as destination:
                          shutil.copyfileobj(source, destination)

              # Remove the processed update archive only after successful extraction.
              archive.unlink()
              print(f'Removed processed ZIP: {archive.name}')

      - name: Commit applied files
        run: |
          set -euo pipefail
          git config user.name "iumrah-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply iumrah Business update [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
