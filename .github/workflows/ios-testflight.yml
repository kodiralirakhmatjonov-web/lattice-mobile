name: iumrah Business — iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Archive and upload iPhone + iPad build to TestFlight'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: iumrah-business-ios-testflight
  cancel-in-progress: true

jobs:
  ios-testflight:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCHEME: iumrahBusiness
      PROJECT: iumrahBusiness.xcodeproj
      BUNDLE_ID: com.iumrah.business
      IOS_ARCHIVE: build/iumrahBusiness-iOS.xcarchive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Verify iPhone + iPad source configuration
        run: |
          set -euo pipefail
          test -f project.yml
          test -d Sources
          test -f Resources/iumrahBusiness.entitlements

          grep -F 'TARGETED_DEVICE_FAMILY: "1,2"' project.yml >/dev/null || {
            echo 'STOP: project.yml must target both iPhone and iPad.'
            exit 1
          }

      - name: Generate Xcode project
        run: |
          rm -rf "$PROJECT"
          xcodegen generate
          test -d "$PROJECT"

      - name: Compile-only preflight
        if: ${{ !inputs.upload_to_testflight }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Check iOS TestFlight signing requirements
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IOS_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in APPLE_TEAM_ID APPLE_ID_EMAIL APPLE_APP_SPECIFIC_PASSWORD IOS_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

          test -f Signing/distribution-private-key.enc || {
            echo 'Missing Signing/distribution-private-key.enc'
            exit 1
          }

          test -f Signing/iumrah-business.mobileprovision || {
            echo 'Missing Signing/iumrah-business.mobileprovision'
            exit 1
          }

      - name: Install iOS distribution signing identity
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          IOS_PROFILE='Signing/iumrah-business.mobileprovision'
          PRIVATE_KEY="$RUNNER_TEMP/distribution-private-key.pem"
          CERT_PEM="$RUNNER_TEMP/apple-distribution.pem"
          P12_PATH="$RUNNER_TEMP/apple-distribution.p12"
          P12_PASSWORD="ios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          KEYCHAIN_PATH="$RUNNER_TEMP/iumrah-ios-signing.keychain-db"

          security cms -D -i "$IOS_PROFILE" > "$RUNNER_TEMP/ios-profile.plist"

          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/ios-profile.plist")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/ios-profile.plist")
          IOS_APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/ios-profile.plist" 2>/dev/null || true)
          IOS_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ios-profile.plist")
          IOS_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/ios-profile.plist")

          test "$PROFILE_TEAM" = "$APPLE_TEAM_ID" || {
            echo "Team mismatch: $PROFILE_TEAM"
            exit 1
          }
          test "$APP_IDENTIFIER" = "$APPLE_TEAM_ID.$BUNDLE_ID" || {
            echo "Bundle mismatch: $APP_IDENTIFIER"
            exit 1
          }
          test "$IOS_APS" = 'production' || {
            echo "iOS App Store profile must contain aps-environment=production; found: ${IOS_APS:-missing}"
            exit 1
          }

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in Signing/distribution-private-key.enc \
            -out "$PRIVATE_KEY" \
            -pass env:IOS_SIGNING_KEY_PASSWORD

          APP_KEY_FP=$(openssl pkey -in "$PRIVATE_KEY" -pubout 2>/dev/null | openssl sha256)

          IOS_PROFILE_PLIST="$RUNNER_TEMP/ios-profile.plist" \
          CERT_DIR="$RUNNER_TEMP/ios-profile-certs" \
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path

          src = Path(os.environ["IOS_PROFILE_PLIST"])
          out = Path(os.environ["CERT_DIR"])
          out.mkdir(parents=True, exist_ok=True)
          with src.open("rb") as f:
              profile = plistlib.load(f)
          certs = profile.get("DeveloperCertificates") or []
          if not certs:
              raise SystemExit("iOS profile contains no DeveloperCertificates")
          for i, cert in enumerate(certs):
              (out / f"cert-{i}.der").write_bytes(cert)
          PY

          MATCHED=''
          for candidate in "$RUNNER_TEMP"/ios-profile-certs/*.der; do
            pem="${candidate%.der}.pem"
            openssl x509 -inform DER -in "$candidate" -out "$pem"
            fp=$(openssl x509 -in "$pem" -pubkey -noout 2>/dev/null | openssl sha256)
            if [ "$fp" = "$APP_KEY_FP" ]; then
              cp "$pem" "$CERT_PEM"
              MATCHED="$candidate"
              break
            fi
          done

          test -n "$MATCHED" || {
            echo 'No Apple Distribution certificate in the iOS profile matches distribution-private-key.enc.'
            exit 1
          }

          openssl pkcs12 -export \
            -inkey "$PRIVATE_KEY" \
            -in "$CERT_PEM" \
            -out "$P12_PATH" \
            -name 'Apple Distribution' \
            -passout pass:"$P12_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$IOS_PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          cp "$IOS_PROFILE" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E 'Apple Distribution|3rd Party Mac Developer Application' >/dev/null || {
            echo 'Apple Distribution signing identity is unavailable.'
            exit 1
          }

          echo "IOS_PROFILE_NAME=$IOS_PROFILE_NAME" >> "$GITHUB_ENV"
          # This split workflow has its own GITHUB_RUN_NUMBER sequence starting at 1.
          # App Store Connect already contains older iumrah Business builds (e.g. 107),
          # so use a stable offset to guarantee every new iOS build is higher.
          IOS_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "iOS TestFlight build number: $IOS_BUILD_NUMBER"

      - name: Archive signed iPhone + iPad build
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build/diagnostics

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/$IOS_ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            archive | tee build/diagnostics/ios-archive.log

      - name: Verify iPhone + iPad archive
        if: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail

          APP_PATH=$(find "$PWD/$IOS_ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH" || { echo 'Archived iOS app not found.'; exit 1; }

          INFO="$APP_PATH/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          test "$BUNDLE" = "$BUNDLE_ID"

          FAMILY=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$INFO")
          echo "$FAMILY"
          echo "$FAMILY" | grep -q '1' || { echo 'iPhone support missing.'; exit 1; }
          echo "$FAMILY" | grep -q '2' || { echo 'iPad support missing.'; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Export iPhone + iPad IPA
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions-iOS.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST

          rm -rf build/export-ios
          xcodebuild -exportArchive \
            -archivePath "$PWD/$IOS_ARCHIVE" \
            -exportPath "$PWD/build/export-ios" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-iOS.plist"

          IPA=$(find "$PWD/build/export-ios" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA" || { echo 'Exported IPA not found.'; exit 1; }
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Validate and upload iOS build to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          xcrun altool --validate-app \
            --type ios \
            -f "$IPA_PATH" \
            -u "$APPLE_ID_EMAIL" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            -u "$APPLE_ID_EMAIL" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

          echo "Uploaded iPhone + iPad build $IOS_BUILD_NUMBER"

      - name: Upload iOS diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iumrah-business-ios-${{ github.run_number }}
          path: |
            build/diagnostics
            build/export-ios/*.ipa
            build/*.xcarchive/Info.plist
          if-no-files-found: ignore
          retention-days: 7
