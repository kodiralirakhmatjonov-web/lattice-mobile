name: Deploy iumrah Hotels Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/HotelsWorker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      D1_NAME: iumrah-hotels
      R2_NAME: iumrah-hotels-media

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare secrets
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Install Wrangler
        run: npm install

      - name: Validate Worker source
        run: npm run check

      - name: Resolve or create D1 database
        id: d1
        run: |
          set -euo pipefail

          LIST=$(curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          DB_ID=$(printf '%s' "$LIST" | jq -r --arg NAME "$D1_NAME" \
            '.result[]? | select(.name == $NAME) | (.uuid // .id)' | head -n 1)

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Creating D1 database: $D1_NAME"
            CREATED=$(curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${D1_NAME}\",\"primary_location_hint\":\"apac\"}")
            DB_ID=$(printf '%s' "$CREATED" | jq -r '.result.uuid // .result.id // empty')
          fi

          if [ -z "$DB_ID" ]; then
            echo "Could not resolve D1 database id."
            exit 1
          fi

          echo "D1 database: $D1_NAME ($DB_ID)"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve or create R2 bucket
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o "$RUNNER_TEMP/r2-get.json" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          if [ "$STATUS" = "404" ]; then
            echo "Creating R2 bucket: $R2_NAME"
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${R2_NAME}\",\"locationHint\":\"apac\",\"storageClass\":\"Standard\"}" \
              | jq -e '.success == true' >/dev/null
          elif [ "$STATUS" = "200" ]; then
            echo "R2 bucket already exists: $R2_NAME"
          else
            cat "$RUNNER_TEMP/r2-get.json"
            echo "Unexpected R2 API status: $STATUS"
            exit 1
          fi

      - name: Generate Wrangler production config
        run: |
          node scripts/render-config.mjs "${{ steps.d1.outputs.database_id }}" "$CLOUDFLARE_ZONE_ID"
          node -e "JSON.parse(require('fs').readFileSync('wrangler.generated.jsonc','utf8')); console.log('Wrangler config JSON OK')"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply HOTELS_DB --remote --config wrangler.generated.jsonc

      - name: Deploy Worker routes
        run: npx wrangler deploy --config wrangler.generated.jsonc

      - name: Verify public Hotels Cloud
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if RESPONSE=$(curl -fsS "https://iumrah.app/api/catalog/hotels/health"); then
              echo "$RESPONSE" | jq .
              echo "$RESPONSE" | jq -e '.ok == true and .database == "iumrah-hotels"' >/dev/null
              echo "iumrah Hotels Cloud is online."
              exit 0
            fi
            sleep 5
          done
          echo "Hotels Cloud health check failed after deployment."
          exit 1
