name: Build iumrah Business / Universal TestFlight — iPhone + iPad + Mac

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload iPhone/iPad + Mac Catalyst builds to one App Store Connect app'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Intel runner is intentional: the Mac Catalyst preflight always compiles the
    # x86_64 slice needed by Intel Macs. The archive also cross-compiles arm64.
    runs-on: macos-26-intel
    timeout-minutes: 75
    env:
      SCHEME: iumrahBusiness
      PROJECT: iumrahBusiness.xcodeproj
      BUNDLE_ID: com.iumrah.business
      IOS_ARCHIVE: build/iumrahBusiness-iOS.xcarchive
      MAC_ARCHIVE: build/iumrahBusiness-MacCatalyst.xcarchive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify universal source configuration
        run: |
          set -euo pipefail

          test -f project.yml
          test -d Sources
          test -d Resources/Assets.xcassets/AppIcon.appiconset
          test -f Resources/iumrahBusiness.entitlements
          test -f Resources/iumrahBusinessMac.entitlements

          grep -F 'TARGETED_DEVICE_FAMILY: "1,2"' project.yml >/dev/null || {
            echo 'STOP: project.yml must support both iPhone and iPad (TARGETED_DEVICE_FAMILY: "1,2").'
            exit 1
          }
          grep -F 'SUPPORTS_MACCATALYST: YES' project.yml >/dev/null || {
            echo 'STOP: Mac Catalyst is not enabled in project.yml.'
            exit 1
          }
          grep -F 'DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO' project.yml >/dev/null || {
            echo 'STOP: Mac Catalyst must keep com.iumrah.business instead of deriving maccatalyst.*.'
            exit 1
          }
          grep -F 'Resources/iumrahBusinessMac.entitlements' project.yml >/dev/null || {
            echo 'STOP: Mac Catalyst entitlement file is not configured.'
            exit 1
          }

          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' Resources/iumrahBusinessMac.entitlements | grep -Fx 'true' >/dev/null || {
            echo 'STOP: Mac App Sandbox is not enabled.'
            exit 1
          }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' Resources/iumrahBusinessMac.entitlements | grep -Fx 'true' >/dev/null || {
            echo 'STOP: Mac outgoing network entitlement is required for iumrah Business APIs.'
            exit 1
          }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.aps-environment' Resources/iumrahBusinessMac.entitlements | grep -Fx 'production' >/dev/null || {
            echo 'STOP: Mac Catalyst must use the macOS APNs entitlement com.apple.developer.aps-environment=production.'
            exit 1
          }

          echo 'Universal source configuration passed.'

      - name: Xcode environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Verify iPhone, iPad and Mac AppIcon renditions
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          import struct

          root = Path('Resources/Assets.xcassets/AppIcon.appiconset')
          data = json.loads((root / 'Contents.json').read_text())

          required = {
              ('iphone', '20x20', '2x'), ('iphone', '20x20', '3x'),
              ('iphone', '29x29', '2x'), ('iphone', '29x29', '3x'),
              ('iphone', '40x40', '2x'), ('iphone', '40x40', '3x'),
              ('iphone', '60x60', '2x'), ('iphone', '60x60', '3x'),
              ('ipad', '20x20', '1x'), ('ipad', '20x20', '2x'),
              ('ipad', '29x29', '1x'), ('ipad', '29x29', '2x'),
              ('ipad', '40x40', '1x'), ('ipad', '40x40', '2x'),
              ('ipad', '76x76', '1x'), ('ipad', '76x76', '2x'),
              ('ipad', '83.5x83.5', '2x'),
              ('mac', '16x16', '1x'), ('mac', '16x16', '2x'),
              ('mac', '32x32', '1x'), ('mac', '32x32', '2x'),
              ('mac', '128x128', '1x'), ('mac', '128x128', '2x'),
              ('mac', '256x256', '1x'), ('mac', '256x256', '2x'),
              ('mac', '512x512', '1x'), ('mac', '512x512', '2x'),
              ('ios-marketing', '1024x1024', '1x'),
          }

          found = {}
          for item in data.get('images', []):
              key = (item.get('idiom'), item.get('size'), item.get('scale'))
              if key in required:
                  filename = item.get('filename')
                  if not filename:
                      raise SystemExit(f'Missing filename for icon slot {key}')
                  path = root / filename
                  if not path.exists():
                      raise SystemExit(f'Missing icon file: {path}')
                  found[key] = filename

          missing = sorted(required - set(found))
          if missing:
              raise SystemExit(f'AppIcon is missing required iPhone/iPad/Mac slots: {missing}')

          marketing_path = root / found[('ios-marketing', '1024x1024', '1x')]
          raw = marketing_path.read_bytes()
          if raw[:8] != b'\x89PNG\r\n\x1a\n' or raw[12:16] != b'IHDR':
              raise SystemExit('App Store icon must be a valid PNG')
          width, height, bit_depth, color_type = struct.unpack('>IIBB', raw[16:26])
          if (width, height) != (1024, 1024):
              raise SystemExit(f'App Store icon must be 1024x1024, got {(width, height)}')
          if color_type in (4, 6):
              raise SystemExit('App Store icon must not contain an alpha channel')

          print('Universal AppIcon manifest passed.')
          PYCODE

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated iOS and Mac Catalyst settings
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -showBuildSettings > build/diagnostics/ios-build-settings.txt

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -showBuildSettings > build/diagnostics/mac-build-settings.txt

          grep -Eq 'TARGETED_DEVICE_FAMILY = 1,2$|TARGETED_DEVICE_FAMILY = "1,2"$' build/diagnostics/ios-build-settings.txt || {
            echo 'Generated iOS target is not universal iPhone+iPad.'
            grep 'TARGETED_DEVICE_FAMILY' build/diagnostics/ios-build-settings.txt || true
            exit 1
          }
          grep -Eq 'SUPPORTS_MACCATALYST = YES$' build/diagnostics/mac-build-settings.txt || {
            echo 'Generated target does not support Mac Catalyst.'
            exit 1
          }
          grep -Eq 'PRODUCT_BUNDLE_IDENTIFIER = com\.iumrah\.business$' build/diagnostics/mac-build-settings.txt || {
            echo 'Mac Catalyst bundle identifier drifted from com.iumrah.business.'
            grep 'PRODUCT_BUNDLE_IDENTIFIER' build/diagnostics/mac-build-settings.txt || true
            exit 1
          }
          grep -Eq 'CODE_SIGN_ENTITLEMENTS = Resources/iumrahBusinessMac\.entitlements$' build/diagnostics/mac-build-settings.txt || {
            echo 'Mac Catalyst is not using Resources/iumrahBusinessMac.entitlements.'
            grep 'CODE_SIGN_ENTITLEMENTS' build/diagnostics/mac-build-settings.txt || true
            exit 1
          }
          grep -Eq 'ENABLE_APP_SANDBOX = YES$' build/diagnostics/mac-build-settings.txt || {
            echo 'Generated Mac Catalyst target does not enable App Sandbox.'
            grep 'ENABLE_APP_SANDBOX' build/diagnostics/mac-build-settings.txt || true
            exit 1
          }
          grep -Eq 'ENABLE_HARDENED_RUNTIME = YES$' build/diagnostics/mac-build-settings.txt || {
            echo 'Generated Mac Catalyst target does not enable Hardened Runtime.'
            grep 'ENABLE_HARDENED_RUNTIME' build/diagnostics/mac-build-settings.txt || true
            exit 1
          }
          grep -Eq 'MACOSX_DEPLOYMENT_TARGET = 14\.0$' build/diagnostics/mac-build-settings.txt || {
            echo 'Mac Catalyst deployment target drifted; expected macOS 14.0 so Intel Macs on macOS 15 remain supported.'
            grep 'MACOSX_DEPLOYMENT_TARGET' build/diagnostics/mac-build-settings.txt || true
            exit 1
          }

      - name: Compile iPhone + iPad target without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | tee build/diagnostics/ios-simulator-build.log

      - name: Compile Mac Catalyst Intel + Apple Silicon without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS='x86_64 arm64' \
            ONLY_ACTIVE_ARCH=NO \
            build | tee build/diagnostics/mac-catalyst-build.log

      - name: Check TestFlight signing requirements
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IOS_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in APPLE_TEAM_ID APPLE_ID_EMAIL APPLE_APP_SPECIFIC_PASSWORD IOS_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

          test -f Signing/distribution-private-key.enc || {
            echo 'Missing Signing/distribution-private-key.enc'
            exit 1
          }
          test -f Signing/mac-installer-private-key.enc || {
            echo 'Missing Signing/mac-installer-private-key.enc'
            echo 'Run Prepare iOS + Mac Signing and add the generated encrypted Mac installer key.'
            exit 1
          }
          test -f Signing/iumrah-business-mac-installer.cer || {
            echo 'Missing Signing/iumrah-business-mac-installer.cer'
            echo 'Create a Mac Installer Distribution certificate from the CSR produced by Prepare Signing.'
            exit 1
          }

          IOS_PROFILE=$(find Signing -maxdepth 1 -type f -name '*.mobileprovision' -print -quit)
          MAC_PROFILE=$(find Signing -maxdepth 1 -type f -name '*.provisionprofile' -print -quit)

          test -n "$IOS_PROFILE" || {
            echo 'Missing iOS App Store Connect .mobileprovision profile in Signing/.'
            exit 1
          }
          test -n "$MAC_PROFILE" || {
            echo 'Missing Mac Catalyst App Store Connect .provisionprofile profile in Signing/.'
            echo 'Create a Mac App Store Connect provisioning profile for com.iumrah.business using the SAME Apple Distribution certificate as iOS.'
            exit 1
          }

          security cms -D -i "$IOS_PROFILE" > "$RUNNER_TEMP/ios-profile.plist"
          security cms -D -i "$MAC_PROFILE" > "$RUNNER_TEMP/mac-profile.plist"

          IOS_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/ios-profile.plist")
          MAC_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/mac-profile.plist")
          EXPECTED="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          test "$IOS_APP_ID" = "$EXPECTED" || {
            echo "iOS profile bundle mismatch: expected $EXPECTED, got $IOS_APP_ID"
            exit 1
          }
          test "$MAC_APP_ID" = "$EXPECTED" || {
            echo "Mac Catalyst profile bundle mismatch: expected $EXPECTED, got $MAC_APP_ID"
            exit 1
          }

          IOS_APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/ios-profile.plist" 2>/dev/null || true)
          MAC_APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.aps-environment' "$RUNNER_TEMP/mac-profile.plist" 2>/dev/null || true)
          # App Sandbox is an app-signing entitlement, not a required key in the
          # Mac App Store Connect provisioning profile. It is verified earlier in
          # Resources/iumrahBusinessMac.entitlements and again on the signed archive.

          test "$IOS_APS" = 'production' || {
            echo "iOS App Store profile must contain aps-environment=production; found: ${IOS_APS:-missing}"
            exit 1
          }
          test "$MAC_APS" = 'production' || {
            echo "Mac App Store Connect profile must contain com.apple.developer.aps-environment=production; found: ${MAC_APS:-missing}"
            echo 'Enable Push Notifications for the App ID and regenerate the Mac Catalyst profile.'
            exit 1
          }

          IOS_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ios-profile.plist")
          MAC_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/mac-profile.plist")
          IOS_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/ios-profile.plist")
          MAC_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/mac-profile.plist")

          echo "IOS_PROFILE=$IOS_PROFILE" >> "$GITHUB_ENV"
          echo "MAC_PROFILE=$MAC_PROFILE" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$IOS_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "MAC_PROFILE_NAME=$MAC_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=$IOS_PROFILE_UUID" >> "$GITHUB_ENV"
          echo "MAC_PROFILE_UUID=$MAC_PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=${GITHUB_RUN_NUMBER}.1" >> "$GITHUB_ENV"
          echo "MAC_BUILD_NUMBER=${GITHUB_RUN_NUMBER}.2" >> "$GITHUB_ENV"

          echo "iOS profile: $IOS_PROFILE_NAME"
          echo "Mac Catalyst profile: $MAC_PROFILE_NAME"

      - name: Install app + Mac installer signing identities
        if: ${{ inputs.upload_to_testflight }}
        env:
          IOS_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/iumrah-universal-signing.keychain-db"
          APP_PRIVATE_KEY="$RUNNER_TEMP/distribution-private-key.pem"
          APP_CERT_PEM="$RUNNER_TEMP/apple-distribution.pem"
          APP_P12="$RUNNER_TEMP/apple-distribution.p12"
          APP_P12_PASSWORD="app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          INSTALLER_PRIVATE_KEY="$RUNNER_TEMP/mac-installer-private-key.pem"
          INSTALLER_CERT_PEM="$RUNNER_TEMP/mac-installer.pem"
          INSTALLER_P12="$RUNNER_TEMP/mac-installer.p12"
          INSTALLER_P12_PASSWORD="installer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in Signing/distribution-private-key.enc \
            -out "$APP_PRIVATE_KEY" \
            -pass env:IOS_SIGNING_KEY_PASSWORD

          APP_KEY_FP=$(openssl pkey -in "$APP_PRIVATE_KEY" -pubout 2>/dev/null | openssl sha256)

          # A provisioning profile may contain more than one distribution
          # certificate. Select the one that actually matches our encrypted key.
          IOS_PROFILE_PLIST="$RUNNER_TEMP/ios-profile.plist" CERT_DIR="$RUNNER_TEMP/ios-profile-certs" python3 - <<'PYCODE'
          import os, plistlib
          from pathlib import Path
          out = Path(os.environ['CERT_DIR'])
          out.mkdir(parents=True, exist_ok=True)
          with Path(os.environ['IOS_PROFILE_PLIST']).open('rb') as f:
              profile = plistlib.load(f)
          certs = profile.get('DeveloperCertificates') or []
          if not certs:
              raise SystemExit('iOS profile contains no DeveloperCertificates')
          for index, cert in enumerate(certs):
              (out / f'cert-{index}.der').write_bytes(cert)
          PYCODE

          MATCHED_APP_CERT=''
          for candidate in "$RUNNER_TEMP"/ios-profile-certs/*.der; do
            candidate_pem="${candidate%.der}.pem"
            openssl x509 -inform DER -in "$candidate" -out "$candidate_pem"
            candidate_fp=$(openssl x509 -in "$candidate_pem" -pubkey -noout 2>/dev/null | openssl sha256)
            if [ "$candidate_fp" = "$APP_KEY_FP" ]; then
              cp "$candidate_pem" "$APP_CERT_PEM"
              MATCHED_APP_CERT="$candidate"
              break
            fi
          done
          test -n "$MATCHED_APP_CERT" || {
            echo 'No Apple Distribution certificate in the iOS profile matches distribution-private-key.enc.'
            exit 1
          }

          # The Mac Catalyst profile must authorize that same Apple Distribution key.
          MAC_PROFILE_PLIST="$RUNNER_TEMP/mac-profile.plist" CERT_DIR="$RUNNER_TEMP/mac-profile-certs" python3 - <<'PYCODE'
          import os, plistlib
          from pathlib import Path
          out = Path(os.environ['CERT_DIR'])
          out.mkdir(parents=True, exist_ok=True)
          with Path(os.environ['MAC_PROFILE_PLIST']).open('rb') as f:
              profile = plistlib.load(f)
          certs = profile.get('DeveloperCertificates') or []
          if not certs:
              raise SystemExit('Mac Catalyst profile contains no DeveloperCertificates')
          for index, cert in enumerate(certs):
              (out / f'cert-{index}.der').write_bytes(cert)
          PYCODE

          MAC_PROFILE_MATCH=''
          for candidate in "$RUNNER_TEMP"/mac-profile-certs/*.der; do
            candidate_pem="${candidate%.der}.pem"
            openssl x509 -inform DER -in "$candidate" -out "$candidate_pem"
            candidate_fp=$(openssl x509 -in "$candidate_pem" -pubkey -noout 2>/dev/null | openssl sha256)
            if [ "$candidate_fp" = "$APP_KEY_FP" ]; then
              MAC_PROFILE_MATCH="$candidate"
              break
            fi
          done
          test -n "$MAC_PROFILE_MATCH" || {
            echo 'Mac Catalyst profile does not authorize the Apple Distribution key used by the iOS profile.'
            echo 'Regenerate the Mac Catalyst profile with the same Apple Distribution certificate.'
            exit 1
          }

          openssl pkcs12 -export \
            -inkey "$APP_PRIVATE_KEY" \
            -in "$APP_CERT_PEM" \
            -out "$APP_P12" \
            -name 'Apple Distribution' \
            -passout pass:"$APP_P12_PASSWORD"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in Signing/mac-installer-private-key.enc \
            -out "$INSTALLER_PRIVATE_KEY" \
            -pass env:IOS_SIGNING_KEY_PASSWORD

          if openssl x509 -inform DER -in Signing/iumrah-business-mac-installer.cer -out "$INSTALLER_CERT_PEM" 2>/dev/null; then
            :
          else
            openssl x509 -in Signing/iumrah-business-mac-installer.cer -out "$INSTALLER_CERT_PEM"
          fi

          INSTALLER_KEY_FP=$(openssl pkey -in "$INSTALLER_PRIVATE_KEY" -pubout 2>/dev/null | openssl sha256)
          INSTALLER_CERT_FP=$(openssl x509 -in "$INSTALLER_CERT_PEM" -pubkey -noout 2>/dev/null | openssl sha256)
          test "$INSTALLER_KEY_FP" = "$INSTALLER_CERT_FP" || {
            echo 'Mac Installer certificate does not match mac-installer-private-key.enc.'
            exit 1
          }

          # Apple may display this certificate in the portal as
          # "Mac Installer Distribution" while the actual certificate Common Name
          # is "3rd Party Mac Developer Installer: <Name> (<TeamID>)".
          # Read the real CN from the certificate and use that exact identity for
          # the PKCS#12 and ExportOptions.plist instead of hard-coding a label.
          INSTALLER_CERT_CN=$(
            openssl x509 -in "$INSTALLER_CERT_PEM" -noout -subject -nameopt RFC2253 |
            sed 's/^subject=//' |
            tr ',' '\n' |
            sed -n 's/^CN=//p' |
            head -n 1
          )
          test -n "$INSTALLER_CERT_CN" || {
            echo 'Could not read Common Name from Mac Installer certificate.'
            exit 1
          }
          echo "Mac installer identity: $INSTALLER_CERT_CN"
          echo "INSTALLER_CERT_CN=$INSTALLER_CERT_CN" >> "$GITHUB_ENV"

          openssl pkcs12 -export \
            -inkey "$INSTALLER_PRIVATE_KEY" \
            -in "$INSTALLER_CERT_PEM" \
            -out "$INSTALLER_P12" \
            -name "$INSTALLER_CERT_CN" \
            -passout pass:"$INSTALLER_P12_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_P12" -P "$APP_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_P12" -P "$INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$IOS_PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          cp "$MAC_PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$MAC_PROFILE_UUID.provisionprofile"
          cp "$IOS_PROFILE" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          cp "$MAC_PROFILE" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$MAC_PROFILE_UUID.provisionprofile"

          security find-identity -v "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E 'Apple Distribution|3rd Party Mac Developer Application' >/dev/null || {
            echo 'Apple Distribution signing identity is not available.'
            exit 1
          }

      - name: Archive signed iPhone + iPad build
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/$IOS_ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            archive | tee build/diagnostics/ios-archive.log

      - name: Archive signed universal Mac Catalyst build
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$PWD/$MAC_ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$MAC_PROFILE_NAME" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CURRENT_PROJECT_VERSION="$MAC_BUILD_NUMBER" \
            ARCHS='x86_64 arm64' \
            ONLY_ACTIVE_ARCH=NO \
            archive | tee build/diagnostics/mac-archive.log

      - name: Verify iOS archive supports iPhone + iPad
        if: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$PWD/$IOS_ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH" || { echo 'iOS archived .app not found.'; exit 1; }

          INFO="$APP_PATH/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          test "$BUNDLE" = "$BUNDLE_ID"

          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$INFO" | tee build/diagnostics/ios-device-family.txt
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$INFO" | grep -Fx '1' >/dev/null || {
            echo 'iPhone family (1) missing from archive.'; exit 1;
          }
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$INFO" | grep -Fx '2' >/dev/null || {
            echo 'iPad family (2) missing from archive.'; exit 1;
          }

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo 'iPhone + iPad archive proof passed.'

      - name: Verify Mac Catalyst archive is Intel + Apple Silicon and sandboxed
        if: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$PWD/$MAC_ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH" || { echo 'Mac Catalyst archived .app not found.'; exit 1; }

          INFO="$APP_PATH/Contents/Info.plist"
          test -f "$INFO" || INFO="$APP_PATH/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          test "$BUNDLE" = "$BUNDLE_ID" || {
            echo "Mac bundle mismatch: $BUNDLE"; exit 1;
          }

          BIN="$APP_PATH/Contents/MacOS/$EXECUTABLE"
          test -f "$BIN" || BIN="$APP_PATH/$EXECUTABLE"
          test -f "$BIN" || { echo 'Mac executable not found.'; exit 1; }

          ARCHS=$(lipo -archs "$BIN")
          echo "Mac Catalyst architectures: $ARCHS" | tee build/diagnostics/mac-architectures.txt
          echo "$ARCHS" | grep -qw x86_64 || { echo 'Intel x86_64 slice missing.'; exit 1; }
          echo "$ARCHS" | grep -qw arm64 || { echo 'Apple Silicon arm64 slice missing.'; exit 1; }

          codesign -d --entitlements :- "$APP_PATH" > build/diagnostics/mac-entitlements.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' build/diagnostics/mac-entitlements.plist | grep -Fx 'true' >/dev/null || {
            echo 'Signed Mac archive is missing App Sandbox entitlement.'; exit 1;
          }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' build/diagnostics/mac-entitlements.plist | grep -Fx 'true' >/dev/null || {
            echo 'Signed Mac archive is missing outgoing network entitlement.'; exit 1;
          }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.aps-environment' build/diagnostics/mac-entitlements.plist | grep -Fx 'production' >/dev/null || {
            echo 'Signed Mac archive is missing the production macOS APNs entitlement.'; exit 1;
          }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo 'Universal Mac Catalyst archive proof passed.'

      - name: Export iPhone + iPad IPA
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions-iOS.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST

          rm -rf build/export-ios
          xcodebuild -exportArchive \
            -archivePath "$PWD/$IOS_ARCHIVE" \
            -exportPath "$PWD/build/export-ios" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-iOS.plist"

          IPA=$(find "$PWD/build/export-ios" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA" || { echo 'Exported iOS IPA not found.'; find build/export-ios -maxdepth 2 -type f -print; exit 1; }
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Export Mac Catalyst App Store package
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTALLER_CERT_CN:-}" || {
            echo 'Mac installer certificate Common Name was not exported from the signing step.'
            exit 1
          }
          cat > "$RUNNER_TEMP/ExportOptions-Mac.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>${INSTALLER_CERT_CN}</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${MAC_PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST

          rm -rf build/export-mac
          xcodebuild -exportArchive \
            -archivePath "$PWD/$MAC_ARCHIVE" \
            -exportPath "$PWD/build/export-mac" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-Mac.plist"

          PKG=$(find "$PWD/build/export-mac" -maxdepth 2 -name '*.pkg' -print -quit)
          test -n "$PKG" || { echo 'Exported Mac .pkg not found.'; find build/export-mac -maxdepth 3 -type f -print; exit 1; }
          pkgutil --check-signature "$PKG" | tee build/diagnostics/mac-package-signature.txt
          echo "MAC_PKG_PATH=$PKG" >> "$GITHUB_ENV"

      - name: Validate both TestFlight artifacts before uploading either
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "${IPA_PATH:-}"
          test -n "${MAC_PKG_PATH:-}"

          xcrun altool --validate-app \
            --type ios \
            -f "$IPA_PATH" \
            -u "$APPLE_ID_EMAIL" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

          xcrun altool --validate-app \
            --type macos \
            -f "$MAC_PKG_PATH" \
            -u "$APPLE_ID_EMAIL" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Upload iPhone + iPad and Mac builds to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            -u "$APPLE_ID_EMAIL" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

          xcrun altool --upload-app \
            --type macos \
            -f "$MAC_PKG_PATH" \
            -u "$APPLE_ID_EMAIL" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

          echo "Uploaded one release from one workflow:"
          echo "  iPhone + iPad build: $IOS_BUILD_NUMBER"
          echo "  Mac Catalyst build:  $MAC_BUILD_NUMBER"

      - name: Upload universal build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iumrah-universal-testflight-${{ github.run_number }}
          path: |
            build/diagnostics
            build/export-ios/*.ipa
            build/export-mac/*.pkg
            build/*.xcarchive/Info.plist
          if-no-files-found: ignore
          retention-days: 7
