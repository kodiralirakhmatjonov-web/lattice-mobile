name: iumrah Business — macOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Archive and upload universal Mac Catalyst build to TestFlight'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: iumrah-business-macos-testflight
  cancel-in-progress: true

jobs:
  macos-testflight:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      SCHEME: iumrahBusiness
      PROJECT: iumrahBusiness.xcodeproj
      BUNDLE_ID: com.iumrah.business
      MAC_ARCHIVE: build/iumrahBusiness-MacCatalyst.xcarchive
      MAC_ENTITLEMENTS: Resources/iumrahBusinessMac.entitlements

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode environment
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Verify Mac Catalyst source configuration
        run: |
          set -euo pipefail

          test -f project.yml
          test -f "$MAC_ENTITLEMENTS"

          grep -F 'SUPPORTS_MACCATALYST: YES' project.yml >/dev/null || {
            echo 'STOP: Mac Catalyst is not enabled.'
            exit 1
          }
          grep -F 'DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO' project.yml >/dev/null || {
            echo 'STOP: Mac Catalyst must keep com.iumrah.business.'
            exit 1
          }

          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$MAC_ENTITLEMENTS" | grep -Fx 'true' >/dev/null || {
            echo 'STOP: Mac App Sandbox entitlement is missing.'
            exit 1
          }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$MAC_ENTITLEMENTS" | grep -Fx 'true' >/dev/null || {
            echo 'STOP: Mac outgoing network entitlement is missing.'
            exit 1
          }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.aps-environment' "$MAC_ENTITLEMENTS" | grep -Fx 'production' >/dev/null || {
            echo 'STOP: Mac production APNs entitlement is missing.'
            exit 1
          }

      - name: Generate Xcode project
        run: |
          rm -rf "$PROJECT"
          xcodegen generate
          test -d "$PROJECT"

      - name: Compile-only preflight
        if: ${{ !inputs.upload_to_testflight }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            SUPPORTS_MACCATALYST=YES \
            DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER=NO \
            CODE_SIGN_ENTITLEMENTS="$MAC_ENTITLEMENTS" \
            ENABLE_APP_SANDBOX=YES \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check macOS TestFlight signing requirements
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IOS_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in APPLE_TEAM_ID APPLE_ID_EMAIL APPLE_APP_SPECIFIC_PASSWORD IOS_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

          for file in \
            Signing/distribution-private-key.enc \
            Signing/mac-installer-private-key.enc \
            Signing/iumrah-business-mac-installer.cer \
            Signing/iumrah-business-mac.provisionprofile; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done

      - name: Install Mac app + installer signing identities
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          MAC_PROFILE='Signing/iumrah-business-mac.provisionprofile'
          APP_PRIVATE_KEY="$RUNNER_TEMP/distribution-private-key.pem"
          APP_CERT_PEM="$RUNNER_TEMP/apple-distribution.pem"
          APP_P12="$RUNNER_TEMP/apple-distribution.p12"
          APP_P12_PASSWORD="app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          INSTALLER_PRIVATE_KEY="$RUNNER_TEMP/mac-installer-private-key.pem"
          INSTALLER_CERT_PEM="$RUNNER_TEMP/mac-installer.pem"
          INSTALLER_P12="$RUNNER_TEMP/mac-installer.p12"
          INSTALLER_P12_PASSWORD="installer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          KEYCHAIN_PATH="$RUNNER_TEMP/iumrah-macos-signing.keychain-db"

          security cms -D -i "$MAC_PROFILE" > "$RUNNER_TEMP/mac-profile.plist"

          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/mac-profile.plist")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/mac-profile.plist")
          MAC_APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.aps-environment' "$RUNNER_TEMP/mac-profile.plist" 2>/dev/null || true)
          MAC_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/mac-profile.plist")
          MAC_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/mac-profile.plist")

          test "$PROFILE_TEAM" = "$APPLE_TEAM_ID" || {
            echo "Team mismatch: $PROFILE_TEAM"
            exit 1
          }
          test "$APP_IDENTIFIER" = "$APPLE_TEAM_ID.$BUNDLE_ID" || {
            echo "Bundle mismatch: $APP_IDENTIFIER"
            exit 1
          }
          test "$MAC_APS" = 'production' || {
            echo "Mac profile must contain com.apple.developer.aps-environment=production; found: ${MAC_APS:-missing}"
            exit 1
          }

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in Signing/distribution-private-key.enc \
            -out "$APP_PRIVATE_KEY" \
            -pass env:IOS_SIGNING_KEY_PASSWORD

          APP_KEY_FP=$(openssl pkey -in "$APP_PRIVATE_KEY" -pubout 2>/dev/null | openssl sha256)

          MAC_PROFILE_PLIST="$RUNNER_TEMP/mac-profile.plist" \
          CERT_DIR="$RUNNER_TEMP/mac-profile-certs" \
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path

          src = Path(os.environ["MAC_PROFILE_PLIST"])
          out = Path(os.environ["CERT_DIR"])
          out.mkdir(parents=True, exist_ok=True)
          with src.open("rb") as f:
              profile = plistlib.load(f)
          certs = profile.get("DeveloperCertificates") or []
          if not certs:
              raise SystemExit("Mac Catalyst profile contains no DeveloperCertificates")
          for i, cert in enumerate(certs):
              (out / f"cert-{i}.der").write_bytes(cert)
          PY

          MATCHED=''
          for candidate in "$RUNNER_TEMP"/mac-profile-certs/*.der; do
            pem="${candidate%.der}.pem"
            openssl x509 -inform DER -in "$candidate" -out "$pem"
            fp=$(openssl x509 -in "$pem" -pubkey -noout 2>/dev/null | openssl sha256)
            if [ "$fp" = "$APP_KEY_FP" ]; then
              cp "$pem" "$APP_CERT_PEM"
              MATCHED="$candidate"
              break
            fi
          done

          test -n "$MATCHED" || {
            echo 'Mac Catalyst profile does not authorize distribution-private-key.enc.'
            exit 1
          }

          openssl pkcs12 -export \
            -inkey "$APP_PRIVATE_KEY" \
            -in "$APP_CERT_PEM" \
            -out "$APP_P12" \
            -name 'Apple Distribution' \
            -passout pass:"$APP_P12_PASSWORD"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in Signing/mac-installer-private-key.enc \
            -out "$INSTALLER_PRIVATE_KEY" \
            -pass env:IOS_SIGNING_KEY_PASSWORD

          if openssl x509 -inform DER -in Signing/iumrah-business-mac-installer.cer -out "$INSTALLER_CERT_PEM" 2>/dev/null; then
            :
          else
            openssl x509 -in Signing/iumrah-business-mac-installer.cer -out "$INSTALLER_CERT_PEM"
          fi

          INSTALLER_KEY_FP=$(openssl pkey -in "$INSTALLER_PRIVATE_KEY" -pubout 2>/dev/null | openssl sha256)
          INSTALLER_CERT_FP=$(openssl x509 -in "$INSTALLER_CERT_PEM" -pubkey -noout 2>/dev/null | openssl sha256)

          test "$INSTALLER_KEY_FP" = "$INSTALLER_CERT_FP" || {
            echo 'Mac Installer certificate does not match mac-installer-private-key.enc.'
            exit 1
          }

          INSTALLER_CERT_CN=$(
            openssl x509 -in "$INSTALLER_CERT_PEM" -noout -subject -nameopt RFC2253 |
            sed 's/^subject=//' |
            tr ',' '\n' |
            sed -n 's/^CN=//p' |
            head -n 1
          )

          test -n "$INSTALLER_CERT_CN" || {
            echo 'Could not read Mac Installer certificate Common Name.'
            exit 1
          }

          echo "Mac installer identity: $INSTALLER_CERT_CN"

          openssl pkcs12 -export \
            -inkey "$INSTALLER_PRIVATE_KEY" \
            -in "$INSTALLER_CERT_PEM" \
            -out "$INSTALLER_P12" \
            -name "$INSTALLER_CERT_CN" \
            -passout pass:"$INSTALLER_P12_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_P12" -P "$APP_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_P12" -P "$INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$MAC_PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$MAC_PROFILE_UUID.provisionprofile"
          cp "$MAC_PROFILE" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$MAC_PROFILE_UUID.provisionprofile"

          echo "MAC_PROFILE_NAME=$MAC_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "INSTALLER_CERT_CN=$INSTALLER_CERT_CN" >> "$GITHUB_ENV"
          echo "MAC_BUILD_NUMBER=$((600000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Archive signed universal Mac Catalyst build
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build/diagnostics

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$PWD/$MAC_ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$MAC_PROFILE_NAME" \
            CODE_SIGN_ENTITLEMENTS="$MAC_ENTITLEMENTS" \
            ENABLE_APP_SANDBOX=YES \
            SUPPORTS_MACCATALYST=YES \
            DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CURRENT_PROJECT_VERSION="$MAC_BUILD_NUMBER" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            archive | tee build/diagnostics/mac-archive.log

      - name: Verify universal Mac Catalyst archive
        if: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail

          APP_PATH=$(find "$PWD/$MAC_ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH" || { echo 'Archived Mac app not found.'; exit 1; }

          INFO="$APP_PATH/Contents/Info.plist"
          test -f "$INFO" || INFO="$APP_PATH/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          test "$BUNDLE" = "$BUNDLE_ID"

          BIN="$APP_PATH/Contents/MacOS/$EXECUTABLE"
          test -f "$BIN" || BIN="$APP_PATH/$EXECUTABLE"
          test -f "$BIN" || { echo 'Mac executable not found.'; exit 1; }

          ARCH_LIST=$(lipo -archs "$BIN")
          echo "Mac Catalyst architectures: $ARCH_LIST"
          echo "$ARCH_LIST" | grep -qw arm64 || { echo 'arm64 slice missing.'; exit 1; }
          echo "$ARCH_LIST" | grep -qw x86_64 || { echo 'x86_64 slice missing.'; exit 1; }

          codesign -d --entitlements :- "$APP_PATH" > build/diagnostics/mac-entitlements.plist 2>/dev/null

          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' build/diagnostics/mac-entitlements.plist | grep -Fx 'true' >/dev/null || {
            echo 'Signed Mac app is missing App Sandbox.'
            exit 1
          }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' build/diagnostics/mac-entitlements.plist | grep -Fx 'true' >/dev/null || {
            echo 'Signed Mac app is missing outgoing network entitlement.'
            exit 1
          }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.aps-environment' build/diagnostics/mac-entitlements.plist | grep -Fx 'production' >/dev/null || {
            echo 'Signed Mac app is missing production APNs entitlement.'
            exit 1
          }

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Export Mac Catalyst App Store package
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTALLER_CERT_CN:-}" || {
            echo 'Mac Installer certificate Common Name is unavailable.'
            exit 1
          }

          cat > "$RUNNER_TEMP/ExportOptions-Mac.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>${INSTALLER_CERT_CN}</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${MAC_PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST

          rm -rf build/export-mac
          xcodebuild -exportArchive \
            -archivePath "$PWD/$MAC_ARCHIVE" \
            -exportPath "$PWD/build/export-mac" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-Mac.plist"

          PKG=$(find "$PWD/build/export-mac" -maxdepth 2 -name '*.pkg' -print -quit)
          test -n "$PKG" || { echo 'Exported Mac pkg not found.'; exit 1; }

          pkgutil --check-signature "$PKG"
          echo "MAC_PKG_PATH=$PKG" >> "$GITHUB_ENV"

      - name: Validate and upload Mac build to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          xcrun altool --validate-app \
            --type macos \
            -f "$MAC_PKG_PATH" \
            -u "$APPLE_ID_EMAIL" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

          xcrun altool --upload-app \
            --type macos \
            -f "$MAC_PKG_PATH" \
            -u "$APPLE_ID_EMAIL" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

          echo "Uploaded universal Mac Catalyst build $MAC_BUILD_NUMBER"

      - name: Upload macOS diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iumrah-business-macos-${{ github.run_number }}
          path: |
            build/diagnostics
            build/export-mac/*.pkg
            build/*.xcarchive/Info.plist
          if-no-files-found: ignore
          retention-days: 7
