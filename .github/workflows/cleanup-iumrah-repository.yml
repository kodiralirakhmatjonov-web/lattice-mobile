name: Clean iumrah Business repository

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iumrah-repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Remove legacy root artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing root-level *_APPLIED.txt marker files..."
          find . -maxdepth 1 -type f -name '*_APPLIED.txt' -print -delete

          if [ -f mobile-update.zip ]; then
            echo "Removing legacy mobile-update.zip"
            rm -f mobile-update.zip
          fi

      - name: Prevent artifacts from returning
        shell: python
        run: |
          from pathlib import Path

          path = Path('.gitignore')
          existing = path.read_text(encoding='utf-8') if path.exists() else ''
          additions = ['*_APPLIED.txt', 'mobile-update.zip']

          lines = existing.splitlines()
          changed = False
          for item in additions:
              if item not in lines:
                  if existing and not existing.endswith('\n'):
                      existing += '\n'
                  existing += item + '\n'
                  lines.append(item)
                  changed = True

          if changed:
              path.write_text(existing, encoding='utf-8')

      - name: Verify protected project files remain
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/workflows
          test -d Backend/HotelsWorker
          test -d Sources
          test -d Resources
          test -d Signing
          test -f project.yml

          if find . -maxdepth 1 -type f -name '*_APPLIED.txt' | grep -q .; then
            echo "ERROR: marker files remain in repository root"
            exit 1
          fi

          if [ -e mobile-update.zip ]; then
            echo "ERROR: mobile-update.zip still exists"
            exit 1
          fi

          echo "Repository root cleanup verified."

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "iumrah-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi

          git commit -m "Clean legacy repository artifacts [skip ci]"
          git push origin HEAD:main
